<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>학생 전용 연습 화면</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e9e9ec;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#222}
  .box{background:#fff;width:360px;max-width:calc(100% - 32px);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);overflow:hidden}
  .hd{background:#2470b3;color:#fff;padding:16px 20px;font-weight:bold;font-size:17px}
  form{padding:22px 20px}
  p{margin:0 0 14px;font-size:14px;color:#444}
  input[type=password]{width:100%;box-sizing:border-box;height:42px;border:1px solid #c9d2de;border-radius:4px;padding:0 12px;font-size:15px;background:#eaf1fa}
  label{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin:12px 0 16px}
  button{width:100%;height:42px;border:0;border-radius:4px;background:#2470b3;color:#fff;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#d33;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="box" id="box" style="visibility:hidden">
  <div class="hd">학생 전용 연습 화면</div>
  <form id="lf">
    <p>선생님께 받은 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autofocus required>
    <label><input type="checkbox" id="rem" checked>이 기기에서 30일간 기억하기</label>
    <button id="go">들어가기</button>
    <div class="err" id="err"></div>
  </form>
</div>

(function(){
  var KEY='lock_'+LOCK.salt;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(u){return Array.from(new Uint8Array(u)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
  function show(html){document.open();document.write(html);document.close();}
  async function rawFromPw(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(LOCK.salt),iterations:LOCK.iter,hash:'SHA-256'},base,256);
  }
  async function open(raw){
    var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(LOCK.iv)},key,b64(LOCK.data));
    return new TextDecoder().decode(pt);
  }
  async function tryRemembered(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s&&s.exp>Date.now()){show(await open(unhex(s.k)));return true;}
    }catch(e){try{localStorage.removeItem(KEY);}catch(_){}}
    return false;
  }
  tryRemembered().then(function(ok){if(!ok)document.getElementById('box').style.visibility='visible';});

      if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,JSON.stringify({k:hex(raw),exp:Date.now()+30*864e5}));}catch(_){}}
      show(html);
    }catch(x){err.textContent='비밀번호가 틀렸습니다.';btn.disabled=false;btn.textContent='들어가기';}
  });
})();
</script>
